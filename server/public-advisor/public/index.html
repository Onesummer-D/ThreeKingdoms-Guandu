<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>官渡之战 · 参谋邀约</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background:#0b141b; color:#eef0e8; }
    body { margin:0; padding:24px 16px 48px; background:linear-gradient(160deg,#12242a,#0b141b 50%,#201813); min-height:100vh; }
    main { max-width:560px; margin:auto; }
    .panel { background:rgba(20,35,43,.96); border:1px solid #44585a; border-radius:18px; padding:20px; box-shadow:0 14px 44px #0008; }
    h1 { margin:0 0 6px; font-size:26px; color:#f2d27a; }
    h2 { margin:22px 0 8px; font-size:18px; color:#e4bd5d; }
    .muted { color:#aab8ba; font-size:14px; line-height:1.6; }
    #context { white-space:pre-wrap; line-height:1.7; background:#0e1b22; border-radius:12px; padding:14px; }
    .option { width:100%; text-align:left; padding:14px; margin:8px 0; border-radius:12px; border:1px solid #536967; background:#1d3237; color:#eef0e8; font-size:16px; }
    .option.selected { border-color:#f2d27a; background:#514227; }
    input, textarea { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #536967; background:#0e1b22; color:#eef0e8; padding:12px; font-size:16px; margin:6px 0 12px; }
    textarea { min-height:100px; resize:vertical; }
    button.submit { width:100%; padding:14px; border:0; border-radius:12px; background:#9e7135; color:white; font-size:17px; font-weight:700; }
    button:disabled { opacity:.5; }
    #status { margin-top:14px; color:#b9d6cf; min-height:24px; }
  </style>
</head>
<body>
<main><section class="panel">
  <h1>官渡之战 · 军议邀约</h1>
  <div class="muted">你是受邀参谋。请阅读当前战局，选择一个建议；主将会在游戏中审核，最终决定仍由主将确认。</div>
  <h2>当前战局</h2><div id="context">正在读取战局……</div>
  <h2>你的建议</h2><div id="options"></div>
  <label>参谋昵称<input id="guest" maxlength="40" placeholder="例如：仲达"></label>
  <label>一句理由<textarea id="reason" maxlength="500" placeholder="我建议这样做，因为……"></textarea></label>
  <button class="submit" id="submit">提交建议</button>
  <div id="status"></div>
</section></main>
<script>
  const sessionId = __SESSION_ID__;
  const joinToken = __JOIN_TOKEN__;
  let snapshot = null, selected = -1;
  const $ = id => document.getElementById(id);
  function show(message) { $('status').textContent = message; }
  async function load() {
    const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}?token=${encodeURIComponent(joinToken)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '会话已过期');
    snapshot = data;
    $('context').textContent = (data.snapshot.question || '请根据当前战况给出建议') + '\n\n' +
      (data.snapshot.context || '') + '\n\n资源：' + JSON.stringify(data.snapshot.resources || {});
    $('options').innerHTML = '';
    data.options.forEach((option, index) => {
      const button = document.createElement('button'); button.className = 'option'; button.textContent = `${index + 1}. ${option}`;
      button.onclick = () => { selected = index; document.querySelectorAll('.option').forEach((item, i) => item.classList.toggle('selected', i === selected)); };
      $('options').appendChild(button);
    });
  }
  $('submit').onclick = async () => {
    if (!snapshot || selected < 0) return show('请先选择一个建议。');
    const guestLabel = $('guest').value.trim(); if (!guestLabel) return show('请填写参谋昵称。');
    $('submit').disabled = true; show('正在提交……');
    try {
      const requestId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/suggestions`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ joinToken, guestLabel, optionIndex:selected, reason:$('reason').value, clientRequestId:requestId }) });
      const data = await res.json(); if (!res.ok) throw new Error(data.message || '提交失败');
      show('建议已送达主将，请等待主将审核。'); $('submit').textContent = '已提交';
    } catch (err) { show(err.message); $('submit').disabled = false; }
  };
  load().catch(err => show(err.message));
</script>
</body>
</html>
