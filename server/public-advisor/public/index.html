<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>官渡之战 · 参谋邀约</title>
  <style>
    @font-face { font-family:Guandu; src:url('/assets/game-font.ttf') format('truetype'); font-display:swap; }
    :root { font-family:Guandu,'Noto Serif SC',serif; color:#f0ead9; background:#49392e; }
    * { box-sizing:border-box; }
    body { margin:0; padding:40px 24px 56px; min-height:100vh; }
    body::before { content:''; position:fixed; inset:0; z-index:-1; background:linear-gradient(#241c19b0,#241c1970),url('/assets/battlefield.png') center/cover; }
    main { max-width:760px; margin:auto; }
    h1 { margin:0 0 14px; font-size:32px; font-weight:400; color:#ead09a; text-align:center; }
    h2, .field-title { display:block; margin:30px 0 12px; font-size:22px; font-weight:400; color:#ead09a; line-height:1.5; }
    #context { white-space:pre-wrap; line-height:1.9; font-size:19px; }
    #decision { white-space:pre-wrap; line-height:1.9; font-size:19px; }
    .resources { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin:28px 0; text-align:center; }
    .resources[hidden] { display:none; }
    .resource { margin:0; min-width:0; }
    .resource-ring { position:relative; width:min(100%,112px); aspect-ratio:1; margin:0 auto 10px; }
    .resource-ring svg { width:100%; height:100%; display:block; transform:rotate(-90deg); }
    .resource-track { fill:none; stroke:#f0ead92b; stroke-width:7; }
    .resource-fill { fill:none; stroke:var(--resource-color); stroke-width:7; stroke-linecap:round; }
    .resource-value { position:absolute; inset:0; display:grid; place-content:center; font-size:26px; color:#f0ead9; }
    .resource-value small { display:block; font-size:12px; color:#e4d6c0; }
    .resource figcaption { font-size:19px; color:#ead09a; }
    button, input, textarea { font:inherit; }
    .option { display:block; width:100%; text-align:left; padding:18px 34px; margin:14px 0; border:0; border-radius:0; background:url('/assets/option.png') center/100% 100% no-repeat; color:#493a2b; font-size:19px; line-height:1.6; cursor:pointer; }
    .option.selected { background-image:url('/assets/option-selected.png'); }
    .option:focus-visible, button.submit:focus-visible { outline:2px solid #f1d08b; outline-offset:4px; }
    input, textarea { width:100%; border:1px solid #bca77d; border-radius:0; background:#efe7d6ee; color:#493a2b; padding:14px 16px; font-size:19px; margin:0; }
    input::placeholder, textarea::placeholder { color:#827568; }
    textarea { min-height:100px; resize:vertical; }
    button.submit { display:block; width:260px; max-width:100%; margin:32px auto 0; padding:18px 30px; border:0; border-radius:0; background:url('/assets/option.png') center/100% 100% no-repeat; color:#493a2b; font-size:22px; cursor:pointer; }
    button:disabled { opacity:.65; cursor:default; }
    #status { margin-top:16px; color:#f0ead9; min-height:24px; text-align:center; line-height:1.7; }
    @media (max-width:480px) { body { padding:28px 20px 40px; } h1 { font-size:28px; } #context,#decision,.option,input,textarea { font-size:17px; } h2,.field-title { font-size:21px; } .option { padding:16px 25px; } .resources { gap:10px; } .resource-value { font-size:22px; } .resource figcaption { font-size:17px; } }
    @media (max-width:350px) { .resources { grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; } }
  </style>
</head>
<body>
<main>
  <h1>官渡之战 · 军议邀约</h1>
  <h2>当前战局</h2><div id="context">正在读取战局……</div>
  <div id="resources" class="resources" aria-label="当前资源" hidden></div>
  <div id="decision"></div>
  <h2>你的建议</h2><div id="options"></div>
  <label class="field-title" for="guest">参谋昵称</label><input id="guest" maxlength="40" placeholder="例如：仲达">
  <label class="field-title" for="reason">一句理由</label><textarea id="reason" maxlength="500" placeholder="我建议这样做，因为……"></textarea>
  <button class="submit" id="submit">提交建议</button>
  <div id="status"></div>
</main>
<script>
  const sessionId = __SESSION_ID__;
  const joinToken = __JOIN_TOKEN__;
  let snapshot = null, selected = -1;
  const $ = id => document.getElementById(id);
  function show(message) { $('status').textContent = message; }
  async function load() {
    const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}?token=${encodeURIComponent(joinToken)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '会话已过期');
    snapshot = data;
    const question = (data.snapshot.question || '').trim();
    // Older game clients included the question in context too.
    const context = (data.snapshot.context || '').split(question || '\u0000').join('').trim();
    const resources = data.snapshot.resources || {};
    $('context').textContent = context;
    $('decision').textContent = question || '请根据当前战况给出建议';
    $('resources').replaceChildren();
    const resourceDefinitions = [['troop','兵力','#da7766'],['food','粮草','#e0b75b'],
      ['strategy','计策','#7bc4ab'],['risk','风险','#b69acf']];
    resourceDefinitions.forEach(([key, label, color]) => {
      const known = resources[key] != null && Number.isFinite(Number(resources[key]));
      const value = known ? Math.min(100, Math.max(0, Math.round(Number(resources[key])))) : 0;
      const figure = document.createElement('figure'); figure.className = 'resource';
      figure.style.setProperty('--resource-color', color);
      figure.setAttribute('aria-label', known ? `${label} ${value}/100` : `${label}暂无记录`);
      figure.innerHTML = `<div class="resource-ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="resource-track" cx="50" cy="50" r="43"/><circle class="resource-fill" cx="50" cy="50" r="43" pathLength="100" stroke-dasharray="${value} 100" ${value === 0 ? 'visibility="hidden"' : ''}/></svg><span class="resource-value">${known ? value : '—'}<small>${known ? '/ 100' : '暂无记录'}</small></span></div><figcaption>${label}</figcaption>`;
      $('resources').appendChild(figure);
    });
    $('resources').hidden = false;
    $('options').innerHTML = '';
    data.options.forEach((option, index) => {
      const button = document.createElement('button'); button.className = 'option'; button.textContent = `${index + 1}. ${option}`;
      button.setAttribute('aria-pressed', 'false');
      button.onclick = () => { selected = index; document.querySelectorAll('.option').forEach((item, i) => { item.classList.toggle('selected', i === selected); item.setAttribute('aria-pressed', String(i === selected)); }); };
      $('options').appendChild(button);
    });
  }
  $('submit').onclick = async () => {
    if (!snapshot || selected < 0) return show('请先选择一个建议。');
    const guestLabel = $('guest').value.trim(); if (!guestLabel) return show('请填写参谋昵称。');
    $('submit').disabled = true; show('正在提交……');
    try {
      const requestId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/suggestions`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ joinToken, guestLabel, optionIndex:selected, reason:$('reason').value, clientRequestId:requestId }) });
      const data = await res.json(); if (!res.ok) throw new Error(data.message || '提交失败');
      show('建议已送达主将，请等待主将审核。'); $('submit').textContent = '已提交';
    } catch (err) { show(err.message); $('submit').disabled = false; }
  };
  load().catch(err => show(err.message));
</script>
</body>
</html>
