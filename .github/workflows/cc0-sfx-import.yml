name: CC0 audio source inventory

on:
  push:
    branches: [feat/cc0-battle-sfx-20261015]
    paths:
      - '.github/workflows/cc0-sfx-import.yml'
      - 'tools/audio/cc0_sfx_import.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg p7zip-full
      - name: Download licensed sounds and inventory
        run: python tools/audio/cc0_sfx_import.py --inventory
