name: CC0 audio source inventory

on:
  push:
    branches: [feat/cc0-battle-sfx-20261015]
    paths:
      - '.github/workflows/cc0-sfx-import.yml'
      - 'tools/audio/cc0_sfx_import.py'
      - 'tools/audio/stage_cc0_sfx.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg p7zip-full
      - name: Download verified CC0 sources and stage selected Unity sounds
        run: python tools/audio/stage_cc0_sfx.py
      - name: Commit audio objects and license ledger to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Audio/ImportedCC0 Documentation/QA/CC0ImportedAudio.md
          if ! git diff --cached --quiet; then
            git commit -m "assets(audio): import curated CC0 sounds with provenance"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No audio changes to publish"
          fi
