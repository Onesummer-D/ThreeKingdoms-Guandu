name: Ornate settings UI checks

on:
  pull_request:
    paths:
      - 'Assets/Scripts/UI/HomeHubUI.cs'
      - 'Assets/Scripts/UI/SettingsVisualArt.cs'
      - 'Documentation/QA/OrnateSettingsChecks.js'
      - '.github/workflows/ornate-settings-checks.yml'
  push:
    branches: [main]
    paths:
      - 'Assets/Scripts/UI/HomeHubUI.cs'
      - 'Assets/Scripts/UI/SettingsVisualArt.cs'
      - 'Documentation/QA/OrnateSettingsChecks.js'

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Settings visual and runtime binding checks
        run: node Documentation/QA/OrnateSettingsChecks.js
      - name: Existing audio and HUD checks
        run: node Documentation/QA/AudioHudStaticChecks.js
      - name: Existing runtime button checks
        run: node Documentation/QA/RuntimeButtonSkinChecks.js
